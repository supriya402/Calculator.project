<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if alternatives</title>
</head>
<body>
    <script>
        //ternary input
        let age = 20;
        let result = age>18 ? 'adult' : 'kid';
        console.log(result);


    // Guard operatpr
    let Age;
    let finalAge = Age || 18; //in this case age is treated as as falsy value(undefine)
    console.log(age);
    console.log(finalAge);                                                    




    </script>
</body>
</html>
