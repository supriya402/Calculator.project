<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Json</title>
</head>
<body>
    <script>
        let product = {name : 'shirt',
            price: 500,
            rating :{
               stars : 4.5,
               noOfReviews: 400, 
            },
        };
        console.log(typeof product);
        console.log(product);
        /// ye JSon mai convert kr dega..
        let str = JSON.stringify(product);
        console.log(typeof str);
        console.log(str);

        /// ye wps se object mai convert kr dega..
        let newProduct = JSON.parse(str);
        console.log(typeof newProduct);
        console.log(newProduct);

        localStorage.setItem('Name','supriya');
        localStorage.setItem('age',18);
        localStorage.setItem('Reg.no.',2344214);

        /// agr upe wale code comment kr du tb ye value return kr dega q ki ye storage mai save ho jta h isliye..

        console.log(localStorage.getItem('Name'));
        /// it remove the item from localstorage...
        localStorage.removeItem('age');
                   
            
        


    </script>
</body>
</html>
