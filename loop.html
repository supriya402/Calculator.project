<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loop</title>
</head>
<body>
    <script>
        // WHILE LOOP...
        let num = 1; // initialization..
        while(num <= 10){  // condition..
            console.log(num);
            num = num+1;  // updating..
        }

        // DO WHILE LOOP..
        let n = 0; // intialization..
        do{
         console.log(n);
            n++;  // updation.. not forget to updation..
        }while(n <= 5) // condition..

        // FOR LOOP..
        for(let n = 1; n <= 20; n++){
            console.log(n); // 
        }

        // use of array in loops..
        let nums = [1,2,8,-4,6,7];
        for(let index = 0; index <= 5 ; index++){
            console.log(nums[index]);
        }

        // Accumulator Pattern..
        let number = [3,7,9,4];
        let sum = 0;
        for(let i = 0; i< number.length; i++){
            sum = sum + number[i];
            //console.log('sum of array is '+ sum);
        }
        console.log('sum of array is '+ sum);

        // SQUARE OF AN ARRAY..
        let square = [];
        for(let i = 0; i < number.length ; i++){
             // square[i] = number[i]*number[i]; // or use push methood
             square.push(nums[i]*nums[i]);
        }
        console.log(square);

        // break..
        for(let i = 0; i < 30; i++){
            console.log(i);
            if(i == 20){
                break;
            }
        }

        for(let i = 0; i < 31; i++){
            console.log(i);
            if(i == 20){
                continue;
            }
        }

        let arr = [1,3,4,5,6,7];
        for(let i = 0; i< number.length; i++){
            if(arr[i] === 4){
                console.log(i);
                break;
            }
            console.log('still looking');
        }

        // CONTINuE...for print odd number..
        for(let i = 1; i <= 25; i++){
            if(i % 2 == 0){
                continue;
            }
            console.log(i);
        }

    </script>
</body>
</html>
